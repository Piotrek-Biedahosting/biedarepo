name: Deploy PHP to Biedahosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      # --- WYSYŁANIE BEZPOŚREDNIE PRZEZ RSYNC + SSH ---
      - name: Deploy przez rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/buser1/public_html/githubTest/"
          # Czyszczenie folderu docelowego przed wrzuceniem
          CLEAN: true 
          # Pliki i foldery, których NIE chcemy wysyłać
          EXCLUDE: "/.git/, /.github/, /README.md, /build_folder/"
